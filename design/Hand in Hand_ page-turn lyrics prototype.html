<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand in Hand: page-turn lyrics prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#DCE3D8; --ink:#2B2A26; --paper:#F8F1DB; --paper2:#EEE3C2; --muted:#6B6554;
  --forest:#2F5D46; --berry:#A63446; --ctl:#FFFFFF; --ctl-ink:#23302A; --ctl-line:#B9C4B5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141815; --ctl:#222924; --ctl-ink:#E8E4D6; --ctl-line:#3B463F;}
}
:root[data-theme="dark"]{--bg:#141815; --ctl:#222924; --ctl-ink:#E8E4D6; --ctl-line:#3B463F;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ctl-ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px}
.stage{--font:"Fredoka","Trebuchet MS",system-ui,sans-serif;perspective:1600px;position:relative;width:min(88vw,400px,calc((100svh - 170px) * .75));aspect-ratio:3/4;font-family:var(--font)}
.stage[data-look="classic"]{--font:"Lora",Georgia,"Times New Roman",serif}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .9s cubic-bezier(.55,.1,.3,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(90deg,rgba(60,45,20,.22) 0,rgba(60,45,20,0) 7%),linear-gradient(180deg,var(--paper),var(--paper2));
  color:var(--ink);border-radius:4px 12px 12px 4px;box-shadow:0 10px 24px rgba(0,0,0,.28);
  padding:9% 9% 11% 12%;display:flex;flex-direction:column;justify-content:center}
.leaf.turned{transform:rotateY(-180deg)}
.leaf.chorus::after{content:"";position:absolute;inset:3.5% 4% 3.5% 7%;border:3px double var(--forest);border-radius:4px 8px 8px 4px;pointer-events:none}
.tag{font-style:italic;font-size:.95rem;color:var(--muted);margin:0 0 .6em}
.chorus .tag{color:var(--forest);font-weight:600}
.line{margin:.3em 0;font-size:clamp(1.05rem,4.7vw,1.45rem);line-height:1.45;opacity:.28;transition:opacity .5s,color .5s}
.line.sung{opacity:1}
.line.now{color:var(--berry)}
.pn{position:absolute;bottom:4.5%;left:0;right:0;text-align:center;font-size:.8rem;color:var(--muted)}
.cover,.back{align-items:center;text-align:center}
h1{font-size:clamp(2rem,9vw,2.9rem);line-height:1.1;margin:0 0 .4em;color:var(--forest)}
.sub{margin:0;font-size:1.1rem}
.by{margin:.5em 0 0;font-size:.95rem;color:var(--muted);font-style:italic}
.orn{width:56px;height:4px;border-radius:2px;background:var(--berry);margin:1.2em auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;min-height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ctl-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
button.main{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:600;min-width:96px}
#status{font-size:.9rem;min-width:96px;text-align:center}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}.line{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" data-look="kids" aria-label="Lyrics book"></div>
<div class="bar">
  <button id="prev" aria-label="Previous page">Back</button>
  <button id="play" class="main">Play</button>
  <button id="next" aria-label="Next page">Next</button>
  <button id="look">Classic look</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
<script>
const song = {
  title: "Hand in Hand",
  lyrics: [
    "[Verse]","Two little kids in the big green wood,","Hansel and Gretel did the best they could,","Hansel dropped pebbles, shiny and white,","They found their way home in the moonlight","",
    "[Chorus]","Hand in hand, hand in hand,","Hungry and small, but a brave little band,","A friend by your side makes the dark seem light,","Together we’re strong, and it all turns out right","",
    "[Verse]","Next time he dropped some bread on the ground,","Little birds ate every crumb they found,","Then a gingerbread house came into sight,","With candy and cookies, oh what a delight!","",
    "[Chorus]","Hand in hand, hand in hand,","Hungry and small, but a brave little band,","A friend by your side makes the dark seem light,","Together we’re strong, and it all turns out right","",
    "[Bridge]","A grumpy old witch lived in the sweet little home,","She locked up Hansel, and he felt alone,","But Gretel stayed calm and thought it through,","And her clever plan came true","",
    "[Verse]","The witch’s spell was gone that day,","They gathered treasure and went on their way,","Home to Father, hugs so tight,","No more hungry, all was right","",
    "[Chorus]","Hand in hand, hand in hand,","Home again, a happy little band,","A friend by your side makes the dark seem light,","Together we’re strong, and it all turns out right","",
    "[Outro]","Hand in hand, safe and sound,","Home again, where love is found"
  ]
};
const LINE_MS = 2200, HOLD_MS = 1200, COVER_MS = 2600;
const stage = document.getElementById("stage");
const pages = [{type:"cover"}];
song.lyrics.forEach(l => {
  if (l.startsWith("[")) pages.push({type:"lyric", tag:l.slice(1,-1), lines:[]});
  else if (l !== "") pages[pages.length-1].lines.push(l);
});
pages.push({type:"back"});
const N = pages.length;
const leaves = pages.map((p,i) => {
  const el = document.createElement("div");
  el.className = "leaf" + (p.type==="lyric" ? "" : " "+p.type) + (p.tag==="Chorus" ? " chorus" : "");
  el.style.zIndex = N - i;
  if (p.type==="cover") el.innerHTML = '<h1>'+song.title+'</h1><p class="sub">A song from the tale of Hansel and Gretel</p><div class="orn"></div><p class="by">Brothers Grimm, 1812</p>';
  else if (p.type==="back") el.innerHTML = '<h1>The end</h1><div class="orn"></div><p class="sub">Your channel name</p>';
  else el.innerHTML = '<p class="tag">'+p.tag+'</p>'+p.lines.map(t=>'<div class="line">'+t+'</div>').join("")+'<div class="pn">'+i+'</div>';
  stage.appendChild(el);
  return el;
});
let cur = 0, playing = false, pageTimer = null, lineTimer = null;
const playBtn = document.getElementById("play"), status = document.getElementById("status");
function clearTimers(){ clearTimeout(pageTimer); clearInterval(lineTimer); }
function runPage(){
  const lines = leaves[cur].querySelectorAll(".line");
  if (!lines.length){ pageTimer = setTimeout(advance, COVER_MS); return; }
  lines.forEach(l => l.classList.remove("sung","now"));
  let k = 0;
  const step = () => {
    if (k > 0) lines[k-1].classList.remove("now");
    if (k < lines.length){ lines[k].classList.add("sung","now"); k++; } else clearInterval(lineTimer);
  };
  step(); lineTimer = setInterval(step, LINE_MS);
  pageTimer = setTimeout(advance, lines.length * LINE_MS + HOLD_MS);
}
function advance(){ if (cur < N-1) go(cur+1); else stop(); }
function go(i){
  clearTimers();
  cur = Math.max(0, Math.min(N-1, i));
  leaves.forEach((el,j) => el.classList.toggle("turned", j < cur));
  const lines = leaves[cur].querySelectorAll(".line");
  if (playing) runPage();
  else lines.forEach(l => { l.classList.add("sung"); l.classList.remove("now"); });
  status.textContent = "Page " + (cur+1) + " of " + N;
}
function start(){ if (cur >= N-1) cur = 0; playing = true; playBtn.textContent = "Pause"; go(cur); }
function stop(){ playing = false; playBtn.textContent = "Play"; clearTimers(); go(cur); }
playBtn.onclick = () => playing ? stop() : start();
document.getElementById("next").onclick = () => go(cur+1);
document.getElementById("prev").onclick = () => go(cur-1);
document.getElementById("look").onclick = e => {
  const kids = stage.dataset.look === "kids";
  stage.dataset.look = kids ? "classic" : "kids";
  e.target.textContent = kids ? "Kids look" : "Classic look";
};
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur+1);
  else if (e.key === "ArrowLeft") go(cur-1);
  else if (e.key === " " && e.target.tagName !== "BUTTON"){ e.preventDefault(); playing ? stop() : start(); }
});
go(0);
</script>
</body>
</html>
